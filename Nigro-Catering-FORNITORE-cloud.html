<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nigro Catering — Pannello Fornitore (cloud)</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>html,body{margin:0;padding:0;background:#F4EDDF}#root{font-family:system-ui,sans-serif;color:#857B6A;padding:60px 20px;text-align:center}</style>
</head>
<body>
<div id="root">Avvio dell'app…</div>

  <script>
    (function () {
      function show(m) {
        var d = document.getElementById('err-bar');
        if (!d) { d = document.createElement('div'); d.id = 'err-bar';
          d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#7a1f1f;color:#fff;font:13px/1.4 system-ui,sans-serif;padding:10px 14px;z-index:99999;white-space:pre-wrap;max-height:45%;overflow:auto';
          (document.body || document.documentElement).appendChild(d); }
        d.textContent = 'Errore (riferiscilo pure): ' + m;
      }
      window.addEventListener('error', function (e) { show((e.message || 'errore') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '')); });
      window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show('Promise: ' + (r && r.message ? r.message : r)); });
    })();
  </script>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef } = React;

/* =====================================================================
   CONFIGURAZIONE — incolla qui i DUE valori presi da Supabase.
   Devono essere IDENTICI nel file CLIENTE e nel file FORNITORE.
   ===================================================================== */
const SUPABASE_URL = "https://ysflxqdavhjjozfrxwtt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5GSiTH_QyE0pa6Qhp6BPOw_wNbb9bVA";
/* ===================================================================== */

const CONFIGURED = !/INCOLLA_QUI/.test(SUPABASE_URL + SUPABASE_ANON_KEY);
let _sb = null;
function _timeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout cloud (" + ms + "ms)")), ms))]);
}
if (CONFIGURED) {
  _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window.storage = {
    async get(k) {
      const { data, error } = await _timeout(_sb.from("kv").select("value").eq("key", k).maybeSingle(), 7000);
      if (error) throw error;
      return data ? { key: k, value: data.value, shared: true } : null;
    },
    async set(k, v) {
      const { error } = await _timeout(_sb.from("kv").upsert({ key: k, value: v }), 7000);
      if (error) throw error;
      return { key: k, value: v, shared: true };
    },
    async delete(k) { await _timeout(_sb.from("kv").delete().eq("key", k), 7000); return { key: k, deleted: true }; },
    async list() { const { data } = await _timeout(_sb.from("kv").select("key"), 7000); return { keys: (data || []).map(r => r.key) }; },
  };
}

function Setup() {
  return (
    <div style={{ fontFamily: "system-ui,sans-serif", maxWidth: 560, margin: "40px auto", padding: 24, background: "#FFFCF4", border: "1px solid #E4D9C2", borderRadius: 16, color: "#26221C" }}>
      <h2 style={{ margin: "0 0 8px", color: "#BE4A2B" }}>Configurazione cloud mancante</h2>
      <p style={{ lineHeight: 1.5, color: "#5b5346" }}>Apri questo file con un editor di testo e incolla i due valori del tuo progetto Supabase nella sezione CONFIGURAZIONE in alto (gli stessi nei due file).</p>
    </div>
  );
}




/* ============================================================
   PANNELLO FORNITORE — Nigro Catering
   Ordini in arrivo, gestione stato, tasto "Ho visto l'ordine"
   (avvisa il cliente in tempo reale). Mostra anche le referenze
   aggiunte dal cliente. Condivide l'archivio cloud con l'App Cliente.
   ============================================================ */

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600;700&display=swap');
:root{
  --cream:#F4EDDF; --paper:#FFFCF4; --olive:#2E4230; --terra:#BE4A2B; --mustard:#CE933B;
  --ink:#26221C; --muted:#857B6A; --line:#E4D9C2; --good:#3C7A4E;
}
*{box-sizing:border-box;margin:0;padding:0}
.ngr{font-family:'Spline Sans',sans-serif;color:var(--ink);background:var(--cream);min-height:100vh;
  background-image:radial-gradient(circle at 15% 0%, #fbf6ea 0%, transparent 40%),radial-gradient(circle at 100% 100%, #efe6d2 0%, transparent 45%);}
.serif{font-family:'Fraunces',serif;}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px;}
.top{position:sticky;top:0;z-index:30;background:rgba(38,34,28,.97);backdrop-filter:blur(6px);color:#F4EDDF;border-bottom:2px solid var(--terra);}
.top-in{max-width:1000px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.logo{width:42px;height:42px;border-radius:11px;background:var(--terra);color:#fff;display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:700;font-size:22px;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.2);}
.brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:21px;line-height:1;letter-spacing:.3px;}
.brand small{display:block;color:#d8cdbd;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;}
.btn{font-family:inherit;font-weight:600;cursor:pointer;border:none;border-radius:11px;padding:11px 18px;font-size:14.5px;transition:.16s;}
.btn-primary{background:var(--terra);color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-seen{background:#EFE6D2;color:var(--olive);border:1.5px solid var(--olive);}
.btn-seen:hover{background:var(--olive);color:#fff;}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.4px;padding:3px 9px;border-radius:999px;text-transform:uppercase;}
.sec-title{font-family:'Fraunces',serif;font-size:27px;font-weight:600;margin-bottom:4px;}
.sec-sub{color:var(--muted);font-size:14.5px;margin-bottom:22px;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .35s ease both;}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(190,74,43,.5)}100%{box-shadow:0 0 0 14px rgba(190,74,43,0)}}
.flash{animation:flash 1.1s ease 2;}
`;

const BASE_PRODUCTS = [
  { id: "p1", n: "Olio EVO", u: "latta" }, { id: "p2", n: "Olio alto oleico", u: "latta" },
  { id: "p3", n: "Olio di semi di girasole", u: "latta" }, { id: "p4", n: "Zucchero", u: "sacco" },
  { id: "p5", n: "Uova", u: "cartone" }, { id: "p6", n: "Seppia", u: "kg" },
  { id: "p7", n: "Mozzarella", u: "kg" },
];
let CATALOG = [...BASE_PRODUCTS];
let PMAP = Object.fromEntries(CATALOG.map((p) => [p.id, p]));
function applyExtras(extras) {
  const ex = Array.isArray(extras) ? extras : [];
  CATALOG = [...BASE_PRODUCTS, ...ex];
  PMAP = Object.fromEntries(CATALOG.map((p) => [p.id, p]));
}
function pname(id) { return PMAP[id] ? PMAP[id].n : id; }
function punit(id) { return PMAP[id] ? PMAP[id].u : ""; }

const CLIENTS = [
  { id: "c1", n: "Pane per i tuoi denti", ref: "Titolare", init: "PD", color: "#BE4A2B" },
];
const CMAP = Object.fromEntries(CLIENTS.map((c) => [c.id, c]));

const SEED = [
  { clientId: "c1", days: 6, items: { p1: 4, p4: 2, p5: 5, p7: 3 } },
];
function seedOrders() {
  return SEED.map((s, i) => ({
    id: `s${i}`, clientId: s.clientId,
    items: Object.entries(s.items).map(([productId, qty]) => ({ productId, qty })),
    status: "evaso", seen: true, ts: Date.now() - s.days * 864e5,
  }));
}
const STATUS = {
  inviato: { label: "Inviato", bg: "#FBEAD2", fg: "#B26A12" },
  lavorazione: { label: "In lavorazione", bg: "#E5EEDC", fg: "#3C7A4E" },
  evaso: { label: "Evaso", bg: "#E2E6DB", fg: "#566747" },
};
const NEXT = { inviato: "lavorazione", lavorazione: "evaso" };
function when(ts) {
  const d = Math.round((Date.now() - ts) / 864e5);
  if (d <= 0) return "oggi"; if (d === 1) return "ieri"; return `${d} giorni fa`;
}
const STORE_KEY = "ngr_orders_v2";
const CATALOG_KEY = "ngr_catalog_v2";

/* ============================================================ */
function App() {
  const [orders, setOrders] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [online, setOnline] = useState(true);
  const [filter, setFilter] = useState("attivi");
  const [flashId, setFlashId] = useState(null);
  const [, setCatTick] = useState(0);
  const lastSaved = useRef("");
  const lastCatalog = useRef("");
  const prevInviati = useRef(null);

  // Rete di sicurezza: se qualcosa si blocca, apri comunque l'app
  useEffect(() => { const t = setTimeout(() => setLoaded(true), 9000); return () => clearTimeout(t); }, []);

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        let data;
        try { const r = await window.storage.get(STORE_KEY, true); data = r ? JSON.parse(r.value) : null; }
        catch { data = null; }
        if (!data) { data = seedOrders(); await window.storage.set(STORE_KEY, JSON.stringify(data), true); }
        try { const c = await window.storage.get(CATALOG_KEY, true); if (c) { applyExtras(JSON.parse(c.value)); lastCatalog.current = c.value; } } catch {}
        if (!alive) return;
        lastSaved.current = JSON.stringify(data);
        prevInviati.current = data.filter((o) => o.status === "inviato").map((o) => o.id);
        setOrders(data); setCatTick((x) => x + 1);
      } catch { if (alive) { setOnline(false); setOrders(seedOrders()); } }
      finally { if (alive) setLoaded(true); }
    })();
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    if (!loaded || !online) return;
    const snap = JSON.stringify(orders);
    if (snap === lastSaved.current) return;
    lastSaved.current = snap;
    window.storage.set(STORE_KEY, snap, true).catch(() => {});
  }, [orders, loaded, online]);

  useEffect(() => {
    if (!loaded || !online) return;
    const t = setInterval(async () => {
      try {
        const r = await window.storage.get(STORE_KEY, true);
        if (r && r.value !== lastSaved.current) {
          lastSaved.current = r.value;
          const data = JSON.parse(r.value);
          const nowInviati = data.filter((o) => o.status === "inviato").map((o) => o.id);
          const fresh = nowInviati.find((id) => prevInviati.current && !prevInviati.current.includes(id));
          prevInviati.current = nowInviati;
          setOrders(data);
          if (fresh) { setFlashId(fresh); setTimeout(() => setFlashId(null), 2500); }
        }
        const c = await window.storage.get(CATALOG_KEY, true);
        if (c && c.value !== lastCatalog.current) { lastCatalog.current = c.value; applyExtras(JSON.parse(c.value)); setCatTick((x) => x + 1); }
      } catch {}
    }, 4000);
    return () => clearInterval(t);
  }, [loaded, online]);

  function advance(id) {
    setOrders((prev) => prev.map((o) => o.status in NEXT && o.id === id ? { ...o, status: NEXT[o.status] } : o));
  }
  function markSeen(id) {
    setOrders((prev) => prev.map((o) => o.id === id ? { ...o, seen: true, seenTs: Date.now() } : o));
  }
  async function resetDemo() {
    const data = seedOrders();
    setOrders(data); lastSaved.current = JSON.stringify(data);
    prevInviati.current = data.filter((o) => o.status === "inviato").map((o) => o.id);
    applyExtras([]); lastCatalog.current = "[]"; setCatTick((x) => x + 1);
    if (online) { try { await window.storage.set(STORE_KEY, JSON.stringify(data), true); await window.storage.set(CATALOG_KEY, "[]", true); } catch {} }
  }

  const sorted = [...orders].sort((a, b) => b.ts - a.ts);
  const list = sorted.filter((o) => filter === "tutti" ? true : filter === "attivi" ? o.status !== "evaso" : o.status === "evaso");
  const counts = {
    inviato: orders.filter((o) => o.status === "inviato").length,
    lavorazione: orders.filter((o) => o.status === "lavorazione").length,
    evaso: orders.filter((o) => o.status === "evaso").length,
  };

  return (
    <div className="ngr">
      <style>{CSS}</style>
      <div className="top">
        <div className="top-in">
          <div className="brand">
            <div className="logo">N</div>
            <div><h1>Nigro Catering</h1><small>Pannello Fornitore</small></div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            {counts.inviato > 0 && <span className="tag" style={{ background: "var(--terra)", color: "#fff", fontSize: 12 }}>{counts.inviato} nuovo{counts.inviato > 1 ? "i" : ""}</span>}
            <span style={{ fontSize: 12, color: online ? "#cfe0c6" : "#e7c9a0", display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: online ? "#7fd49a" : "#e0a44e" }} />
              {online ? "In tempo reale" : "Locale"}
            </span>
          </div>
        </div>
      </div>

      {!loaded ? (
        <div className="wrap" style={{ padding: "80px 20px", textAlign: "center", color: "var(--muted)" }}>Caricamento…</div>
      ) : (
        <div className="wrap" style={{ paddingTop: 26 }}>
          <div className="sec-title serif">Ordini in arrivo</div>
          <div className="sec-sub">Gli ordini inviati dai clienti compaiono qui automaticamente. Premi “Ho visto l’ordine” per avvisare subito il cliente, poi aggiorna lo stato fino all’evasione.</div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12, marginBottom: 22 }}>
            {[["inviato", "Da prendere in carico"], ["lavorazione", "In lavorazione"], ["evaso", "Evasi"]].map(([k, l]) => (
              <div key={k} className="card" style={{ padding: "14px 16px" }}>
                <div className="serif" style={{ fontSize: 30, fontWeight: 600, color: STATUS[k].fg }}>{counts[k]}</div>
                <div style={{ color: "var(--muted)", fontSize: 13 }}>{l}</div>
              </div>
            ))}
          </div>

          <div style={{ display: "flex", gap: 8, marginBottom: 16, alignItems: "center", flexWrap: "wrap" }}>
            {[["attivi", "Attivi"], ["evaso", "Evasi"], ["tutti", "Tutti"]].map(([k, l]) => (
              <button key={k} onClick={() => setFilter(k)} className="btn"
                style={{ padding: "8px 16px", background: filter === k ? "var(--olive)" : "#EFE6D2", color: filter === k ? "#fff" : "var(--olive)" }}>{l}</button>
            ))}
            <button className="btn" style={{ marginLeft: "auto", padding: "8px 14px", background: "#EFE6D2", color: "var(--olive)", fontSize: 12.5 }} onClick={resetDemo}>↺ Ripristina demo</button>
          </div>

          {list.length === 0 && <Empty t="Nessun ordine in questa vista." />}
          {list.map((o) => {
            const cl = CMAP[o.clientId] || { n: o.clientId, ref: "", init: "?", color: "#999" };
            return (
              <div key={o.id} className={`card rise ${flashId === o.id ? "flash" : ""}`} style={{ padding: 18, marginBottom: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 12 }}>
                  <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                    <div style={{ width: 40, height: 40, borderRadius: 10, background: cl.color, color: "#fff", display: "grid", placeItems: "center", fontFamily: "Fraunces,serif", fontWeight: 700, fontSize: 15 }}>{cl.init}</div>
                    <div>
                      <div className="serif" style={{ fontSize: 17, fontWeight: 600 }}>{cl.n}</div>
                      <div style={{ color: "var(--muted)", fontSize: 12.5 }}>{cl.ref} · {when(o.ts)}</div>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    {o.seen && <span className="tag" style={{ background: "#E5EEDC", color: "#3C7A4E" }}>👁 Cliente avvisato</span>}
                    <span className="tag" style={{ background: STATUS[o.status].bg, color: STATUS[o.status].fg }}>{STATUS[o.status].label}</span>
                  </div>
                </div>

                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
                  <tbody>
                    {o.items.map((it, i) => (
                      <tr key={it.productId} style={{ borderTop: i ? "1px solid var(--line)" : "none" }}>
                        <td style={{ padding: "7px 0" }}>{pname(it.productId)}</td>
                        <td style={{ padding: "7px 0", textAlign: "right", fontWeight: 700, whiteSpace: "nowrap" }}>{it.qty} {punit(it.productId)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                {(!o.seen || o.status in NEXT) && (
                  <div style={{ marginTop: 14, display: "flex", gap: 8, justifyContent: "flex-end", flexWrap: "wrap" }}>
                    {!o.seen && <button className="btn btn-seen" onClick={() => markSeen(o.id)}>👁 Ho visto l’ordine</button>}
                    {o.status in NEXT && (
                      <button className="btn btn-primary" onClick={() => advance(o.id)}>
                        {o.status === "inviato" ? "Prendi in carico →" : "Segna come evaso ✓"}
                      </button>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      <div className="wrap" style={{ padding: "30px 20px 50px", color: "var(--muted)", fontSize: 12.5, textAlign: "center" }}>
        {online ? "Collegato all’App Cliente: i nuovi ordini arrivano qui automaticamente." : "Salvataggio non disponibile: la demo funziona in memoria."}
      </div>
    </div>
  );
}

function Empty({ t }) {
  return <div className="card" style={{ padding: 30, textAlign: "center", color: "var(--muted)", fontSize: 14.5 }}>{t}</div>;
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(CONFIGURED ? <App /> : <Setup />);
</script>
</body>
</html>
