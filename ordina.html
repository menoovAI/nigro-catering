<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pane per i tuoi denti — Ordina online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1e8d8; --surface:#fcf8ef; --ink:#2c1f16; --muted:#9a8870; --muted-2:#bcae98;
    --line:rgba(54,35,26,.12); --line-soft:rgba(54,35,26,.06);
    --wheat:#e0a233; --wheat-deep:#bb7c14; --wheat-soft:#f6e7c8; --crust:#36231a; --crust-2:#27160f;
    --good:#5b8c3e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);background:#e2d4bd;-webkit-font-smoothing:antialiased;}
  .phone{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 50px rgba(0,0,0,.12);}

  header{position:sticky;top:0;z-index:10;background:var(--surface);padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:13px;}
  .seal{width:46px;height:46px;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%, #f0c463, var(--wheat) 55%, var(--wheat-deep));display:grid;place-items:center;color:var(--crust-2);box-shadow:0 5px 14px rgba(187,124,20,.35), inset 0 2px 5px rgba(255,255,255,.45);}
  .seal svg{width:27px;height:27px;}
  header h1{font-family:'Fraunces',serif;font-weight:900;font-size:20px;line-height:1;color:var(--crust);letter-spacing:-.01em;}
  header p{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin-top:5px;}

  .intro{padding:16px 18px 4px;color:var(--muted);font-size:14.5px;font-weight:500;line-height:1.4;}
  main{flex:1 1 auto;overflow-y:auto;padding:8px 14px 120px;}
  .sec-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--ink);margin:14px 4px 12px;}
  .item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line-soft);border-radius:18px;padding:15px 16px;margin-bottom:11px;}
  .item-name{flex:1 1 auto;min-width:0;font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--ink);line-height:1.15;}
  .item-ctrl{flex:0 0 auto;}
  .add{width:44px;height:44px;border-radius:13px;border:none;background:linear-gradient(180deg,#ecb34a,var(--wheat));color:var(--crust-2);font-size:27px;font-weight:700;line-height:0;cursor:pointer;box-shadow:0 4px 11px rgba(187,124,20,.32);transition:transform .1s;}
  .add:active{transform:scale(.9);}
  .stepper{display:flex;align-items:center;gap:5px;background:var(--wheat-soft);border-radius:13px;padding:4px;}
  .stepper button{width:36px;height:36px;border-radius:10px;border:none;background:var(--surface);color:var(--wheat-deep);font-size:22px;font-weight:700;line-height:0;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .1s;}
  .stepper button:active{transform:scale(.88);}
  .stepper .qn{min-width:26px;text-align:center;font-weight:800;font-size:17px;color:var(--wheat-deep);font-variant-numeric:tabular-nums;}

  .cartbar{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);bottom:14px;width:min(452px,calc(100% - 28px));z-index:20;background:var(--crust);color:#f3e9da;border-radius:16px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.2,.8,.2,1);}
  .cartbar.show{transform:translateX(-50%) translateY(0);}
  .cartbar .info{font-weight:600;font-size:14px;}
  .cartbar .info b{font-family:'Fraunces',serif;font-size:19px;font-weight:900;color:#fff;}
  .cartbar .cta{background:linear-gradient(180deg,#ecb34a,var(--wheat));color:var(--crust-2);padding:10px 16px;border-radius:11px;font-weight:800;font-size:15px;}

  .overlay{position:fixed;inset:0;z-index:30;background:rgba(20,14,10,.5);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:flex-end;justify-content:center;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;max-height:90vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);}
  .overlay.show .sheet{transform:translateY(0);}
  .sheet-head{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line-soft);}
  .sheet-head h2{font-family:'Fraunces',serif;font-weight:900;font-size:22px;}
  .sheet-close{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;line-height:0;}
  .sheet-body{flex:1 1 auto;overflow-y:auto;padding:8px 20px;}
  .crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);}
  .crow .cn{flex:1 1 auto;min-width:0;font-weight:600;font-size:15.5px;}
  .mini{display:flex;align-items:center;gap:4px;background:var(--wheat-soft);border-radius:11px;padding:3px;}
  .mini button{width:31px;height:31px;border-radius:9px;border:none;background:var(--surface);color:var(--wheat-deep);font-size:19px;font-weight:700;line-height:0;cursor:pointer;}
  .mini .qn{min-width:22px;text-align:center;font-weight:800;font-size:15px;color:var(--wheat-deep);}
  .field{margin:15px 0 6px;} .field.row2{display:flex;gap:12px;} .field.row2>div{flex:1;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;}
  .field input,.field textarea{width:100%;font-family:inherit;font-size:16px;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;outline:none;color:var(--ink);}
  .field textarea{resize:vertical;min-height:52px;}
  .field input:focus,.field textarea:focus{border-color:var(--wheat);}
  .sheet-foot{flex:0 0 auto;padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft);background:var(--bg);}
  .tot-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px;}
  .tot-row .l{font-size:14px;color:var(--muted);font-weight:600;}
  .tot-row .v{font-family:'Fraunces',serif;font-weight:900;font-size:28px;}
  .send{width:100%;padding:17px;border-radius:15px;border:none;background:linear-gradient(180deg,#ecb34a,var(--wheat));color:var(--crust-2);font-family:inherit;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 6px 18px rgba(187,124,20,.35);transition:transform .1s,opacity .2s;}
  .send:active{transform:scale(.98);} .send:disabled{opacity:.5;}
  .hint{text-align:center;font-size:13px;color:var(--muted);margin-top:9px;min-height:15px;}

  .done{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;}
  .done.show{opacity:1;pointer-events:auto;}
  .done .circle{width:96px;height:96px;border-radius:50%;background:var(--good);display:grid;place-items:center;box-shadow:0 10px 30px rgba(91,140,62,.35);animation:pop .4s;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .done .circle svg{width:50px;height:50px;color:#fff;}
  .done h2{font-family:'Fraunces',serif;font-weight:900;font-size:27px;color:var(--crust);}
  .done p{font-size:16px;color:var(--muted);max-width:300px;line-height:1.45;}
  .done button{margin-top:8px;padding:15px 28px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M12 6c0-2 2-3 4-2M12 6c0-2-2-3-4-2M12 11c0-2 2-3 4-2M12 11c0-2-2-3-4-2M12 16c0-2 2-3 4-2M12 16c0-2-2-3-4-2"/></svg></div>
    <div><h1>Pane per i tuoi denti</h1><p>Ordina online</p></div>
  </header>
  <div class="intro">Scegli i prodotti e indica quando vuoi ritirare. Penseremo noi a prepararli.</div>
  <main id="menu"></main>
  <div class="cartbar" id="cartbar" onclick="openSheet()">
    <div class="info"><b id="cartCount">0</b> <span id="cartWord">pezzi</span></div>
    <div class="cta">Vai all'ordine →</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head"><h2>Il tuo ordine</h2><button class="sheet-close" onclick="closeSheet()">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <div class="tot-row"><span class="l">Totale</span><span class="v" id="sheetTotal">0 pezzi</span></div>
      <button class="send" id="sendBtn" onclick="sendOrder()">Invia ordine</button>
      <div class="hint" id="hint"></div>
    </div>
  </div>
</div>

<div class="done" id="done">
  <div class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
  <h2>Ordine inviato!</h2>
  <p id="doneMsg"></p>
  <button onclick="newOrder()">Fai un altro ordine</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Stessa tabella `ordini`: l'ordine arriva al banco e al laboratorio */
const SUPABASE_URL      = 'https://jjcseaerqvdvurptgnwy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Hi9yRrHX9MKWrpWe51vVIQ_HSZTWHmp';

/* Prodotti del panificio (gli stessi del banco) */
const PRODUCTS = ['Campagnola','Pomodoro e formaggio','Spinaci','Broccoli','Melanzana','Ricotta e salsiccia','Ricotta e fave','Ricotta e spinaci','Ricotta e cipolla','Seppia','Spada e melanzana','Friarielli','Patate e salsiccia','Pollo e patate','Pastieri'];

let sb=null, cart={}, sending=false;

function today(){const d=new Date();const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function escHtml(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function renderMenu(){
  document.getElementById('menu').innerHTML = `<div class="sec-title">I nostri prodotti</div>` + PRODUCTS.map((name,i)=>`
    <div class="item">
      <div class="item-name">${escHtml(name)}</div>
      <div class="item-ctrl" id="ctrl-${i}">${ctrlHtml(i)}</div>
    </div>`).join('');
}
function ctrlHtml(i){
  const q=cart[i]||0;
  if(q===0) return `<button class="add" onclick="add(${i})">+</button>`;
  return `<div class="stepper"><button onclick="add(${i},-1)">–</button><span class="qn">${q}</span><button onclick="add(${i},1)">+</button></div>`;
}
function add(i,d=1){
  cart[i]=Math.max(0,(cart[i]||0)+d); if(cart[i]===0) delete cart[i];
  const c=document.getElementById('ctrl-'+i); if(c) c.innerHTML=ctrlHtml(i);
  updateBar(); if(document.getElementById('overlay').classList.contains('show')) renderSheet();
}
function totalQty(){ return Object.values(cart).reduce((s,q)=>s+q,0); }
function updateBar(){
  const n=totalQty();
  document.getElementById('cartCount').textContent=n;
  document.getElementById('cartWord').textContent=n===1?'pezzo':'pezzi';
  document.getElementById('cartbar').classList.toggle('show', n>0);
}

function openSheet(){ if(totalQty()===0) return; renderSheet(); document.getElementById('overlay').classList.add('show'); }
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }
function renderSheet(){
  const n=totalQty();
  const rows=Object.keys(cart).map(i=>`
    <div class="crow">
      <div class="mini"><button onclick="add(${i},-1)">–</button><span class="qn">${cart[i]}</span><button onclick="add(${i},1)">+</button></div>
      <div class="cn">${escHtml(PRODUCTS[i])}</div>
    </div>`).join('');
  const form=`
    <div class="field"><label>Nome cliente</label><input id="fName" type="text" placeholder="Es. Maria Rossi" value="${escHtml(prevName)}"></div>
    <div class="field row2">
      <div><label>Giorno di ritiro</label><input id="fDate" type="date" min="${today()}" value="${prevDate||today()}"></div>
      <div><label>Ora (facolt.)</label><input id="fOra" type="time" value="${prevOra}"></div>
    </div>
    <div class="field"><label>Telefono (facolt.)</label><input id="fPhone" type="tel" inputmode="tel" placeholder="Es. 333 1234567" value="${escHtml(prevPhone)}"></div>
    <div class="field"><label>Note (facolt.)</label><textarea id="fNote" placeholder="Es. ben cotti, ritiro nel pomeriggio...">${escHtml(prevNote)}</textarea></div>`;
  document.getElementById('sheetBody').innerHTML = rows + form;
  document.getElementById('sheetTotal').textContent = n+(n===1?' pezzo':' pezzi');
  document.getElementById('hint').textContent='';
}

/* mantiene i dati del cliente se modifica il carrello */
let prevName='',prevDate='',prevOra='',prevPhone='',prevNote='';
function stashForm(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  prevName=g('fName')||prevName; prevDate=g('fDate')||prevDate; prevOra=g('fOra')||prevOra; prevPhone=g('fPhone')||prevPhone; prevNote=g('fNote')||prevNote;
}

async function sendOrder(){
  if(sending) return;
  stashForm();
  const n=totalQty(); if(n===0) return;
  const name=(document.getElementById('fName').value||'').trim();
  if(!name){ document.getElementById('hint').textContent='Inserisci il tuo nome'; document.getElementById('fName').focus(); return; }
  const date=document.getElementById('fDate').value||today();
  const ora=document.getElementById('fOra').value||'';
  const phone=(document.getElementById('fPhone').value||'').trim();
  const note=(document.getElementById('fNote').value||'').trim();
  const items=Object.keys(cart).map(i=>({name:PRODUCTS[i], qty:cart[i]}));
  const row={ id:'o'+Date.now(), nome:name, telefono:phone||null, data:date, ora:ora||null, note:note||null, stato:'programmato', pezzi:n, items, created_at:new Date().toISOString() };
  sending=true; const btn=document.getElementById('sendBtn'); btn.disabled=true; btn.textContent='Invio in corso...';
  try{
    if(sb){ const { error } = await sb.from('ordini').insert(row); if(error) throw error; }
    const dl=(()=>{ try{ return new Date(date+'T00:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}); }catch(e){ return date; } })();
    document.getElementById('doneMsg').textContent='Grazie '+name+'! Lo prepariamo per '+dl+(ora?' alle '+ora:'')+'.';
    closeSheet(); document.getElementById('done').classList.add('show');
    cart={}; prevName='';prevDate='';prevOra='';prevPhone='';prevNote=''; renderMenu(); updateBar();
  }catch(e){ document.getElementById('hint').textContent='Invio non riuscito, riprova.'; console.error(e); }
  finally{ sending=false; btn.disabled=false; btn.textContent='Invia ordine'; }
}
function newOrder(){ document.getElementById('done').classList.remove('show'); window.scrollTo(0,0); }

/* ---- Avvio ---- */
renderMenu(); updateBar();
if(window.supabase && SUPABASE_URL.indexOf('INSERISCI')<0){ try{ sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ sb=null; } }
</script>
</body>
</html>
